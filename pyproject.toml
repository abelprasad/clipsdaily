[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
dynamic = ["version"]
description = "ClipForge: fully automatic Twitch/Kick clip pipeline — record, cut, post. Zero intervention after one-time setup."
readme = "packaging/README.md"
requires-python = ">=3.10"
license = {text = "Proprietary — see LICENSE"}
authors = [{name = "Abel Prasad", email = "abelprasad4@gmail.com"}]
keywords = ["clips", "twitch", "kick", "youtube", "tiktok", "shorts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "streamlink==8.6.3",
    "faster-whisper==1.2.1",
    "instagrapi==3.1.0",
    "tiktok-uploader==1.2.0",
    "google-api-python-client==2.196.0",
    "google-auth-oauthlib",
    "pyyaml",
    "fastapi>=0.115",  # ClipForge dashboard (dashboard.py)
    "uvicorn>=0.30",  # ClipForge dashboard server
    "requests",
    "playwright",
    "gtts",
    "cryptography>=42",  # license-key verification (Ed25519)
    "yt-dlp",  # VOD downloads (chat.py falls back to PATH yt-dlp)
]

[project.scripts]
clipsdaily = "clipsdaily.cli:main"
clipforge = "clipsdaily.cli:main"

# Public repo, proprietary license: the code is public to read (see README), licensed not sold (see LICENSE).
# The release channel (update_channel in config.yaml) is a private
# repo, set by the vendor when one exists.

[tool.setuptools.dynamic]
version = {attr = "clipsdaily.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
